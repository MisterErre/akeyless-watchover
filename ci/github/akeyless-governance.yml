# Template for YOUR governance repository: copy to .github/workflows/akeyless-governance.yml
# Repository variables:  AKEYLESS_PIPELINE_ACCESS_ID (bootstrap output), AKEYLESS_API (optional),
#                        AKEYLESS_GATEWAY_API (optional), TF_BACKEND_CONFIG (optional, backend -backend-config file path)
# Repository secrets:    TF_VAR_AUTH_METHOD_SECRETS (JSON map), TF_VAR_EVENT_FORWARDER_SECRETS (JSON map),
#                        TF_VAR_GATEWAY_SECRETS (JSON map) + whatever your state backend needs
# Environment "akeyless-production" with required reviewers protects the apply job.
# GitHub Enterprise Server: set the repository variable RUNNER_LABEL to your self-hosted runner label;
#   make actions/checkout, hashicorp/setup-terraform, actions/setup-python and actions/upload-artifact
#   available (GitHub Connect or synced copies; use the upload-artifact version your instance supports);
#   bootstrap with ci.github_url = "https://<ghe-host>" (OIDC issuer https://<ghe-host>/_services/token,
#   whose JWKS endpoint must be reachable from Akeyless).
name: akeyless-governance

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *" # nightly drift detection
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC token -> Akeyless OAuth2/JWT auth method

concurrency:
  group: akeyless-governance
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AKEYLESS_API: ${{ vars.AKEYLESS_API || 'https://api.akeyless.io' }}
  TF_VAR_akeyless_api: ${{ vars.AKEYLESS_API || 'https://api.akeyless.io' }}
  TF_VAR_gateway_api: ${{ vars.AKEYLESS_GATEWAY_API }}
  TF_VAR_pipeline_access_id: ${{ vars.AKEYLESS_PIPELINE_ACCESS_ID }}
  TF_VAR_auth_method_secrets: ${{ secrets.TF_VAR_AUTH_METHOD_SECRETS || '{}' }}
  TF_VAR_event_forwarder_secrets: ${{ secrets.TF_VAR_EVENT_FORWARDER_SECRETS || '{}' }}
  TF_VAR_gateway_secrets: ${{ secrets.TF_VAR_GATEWAY_SECRETS || '{}' }}

jobs:
  checks:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_wrapper: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml pytest
      - name: Terraform format / validate / unit tests (mocked provider)
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
          terraform test
          tests/guard_messages.sh terraform
          tests/export_roundtrip.sh terraform
      - name: Offline access expectations
        run: python3 scripts/akl_simulate.py --model terraform/model --expectations terraform/model/access_expectations.yaml
      - name: Script tests
        run: python3 -m pytest -q scripts/tests

  plan:
    if: github.event_name == 'pull_request'
    needs: checks
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_wrapper: false }
      - name: GitHub OIDC token for Akeyless
        run: |
          jwt="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=akeyless" | jq -r .value)"
          echo "::add-mask::$jwt"
          echo "TF_VAR_pipeline_jwt=$jwt" >> "$GITHUB_ENV"
      - name: Plan
        working-directory: terraform
        run: |
          terraform init ${TF_BACKEND_CONFIG:+-backend-config="$TF_BACKEND_CONFIG"}
          terraform plan -lock=false -out=tfplan
          terraform show -no-color tfplan > plan.txt
          { echo '### Akeyless governance plan'; echo '```'; grep -E '^(Plan:|No changes|  # )' plan.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        env:
          TF_BACKEND_CONFIG: ${{ vars.TF_BACKEND_CONFIG }}
      - uses: actions/upload-artifact@v4
        with: { name: plan, path: terraform/plan.txt, retention-days: 14 }

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    environment: akeyless-production
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_wrapper: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - name: GitHub OIDC token for Akeyless
        run: |
          jwt="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=akeyless" | jq -r .value)"
          echo "::add-mask::$jwt"
          echo "TF_VAR_pipeline_jwt=$jwt" >> "$GITHUB_ENV"
          echo "CI_JWT=$jwt" >> "$GITHUB_ENV"
      - name: Apply
        working-directory: terraform
        run: |
          terraform init ${TF_BACKEND_CONFIG:+-backend-config="$TF_BACKEND_CONFIG"}
          terraform plan -out=tfplan
          terraform apply tfplan
        env:
          TF_BACKEND_CONFIG: ${{ vars.TF_BACKEND_CONFIG }}
      - name: Install Akeyless CLI
        run: |
          curl -sSfo /usr/local/bin/akeyless https://akeyless-cli.s3.us-east-2.amazonaws.com/cli/latest/cli-linux-amd64
          chmod +x /usr/local/bin/akeyless
      - name: Account settings not covered by the provider (CLI)
        run: |
          AKEYLESS_TOKEN="$(AKEYLESS_ACCESS_ID="$TF_VAR_pipeline_access_id" scripts/akl_ci_token.sh)"
          echo "::add-mask::$AKEYLESS_TOKEN"
          AKEYLESS_TOKEN="$AKEYLESS_TOKEN" python3 scripts/akl_account_settings.py --governance terraform/model/governance.yaml

  drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_wrapper: false }
      - name: GitHub OIDC token for Akeyless
        run: |
          jwt="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=akeyless" | jq -r .value)"
          echo "::add-mask::$jwt"
          echo "TF_VAR_pipeline_jwt=$jwt" >> "$GITHUB_ENV"
      - name: Drift check (exit 2 = someone changed Akeyless outside Git)
        working-directory: terraform
        run: |
          terraform init ${TF_BACKEND_CONFIG:+-backend-config="$TF_BACKEND_CONFIG"}
          set +e; terraform plan -lock=false -detailed-exitcode -no-color > drift.txt; rc=$?; set -e
          cat drift.txt
          if [ "$rc" -eq 2 ]; then echo "::error::Akeyless configuration drift detected"; exit 1; fi
          exit "$rc"
        env:
          TF_BACKEND_CONFIG: ${{ vars.TF_BACKEND_CONFIG }}
