auth_methods:
  # The CI/CD identity Terraform runs as is NOT managed here (see ../bootstrap).
  /governance/auth/sso-entra-oidc:
    type: oidc
    description: Human SSO (Entra ID)
    issuer: https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/v2.0
    client_id: 11111111-1111-1111-1111-111111111111
    client_secret_var: entra_oidc_client_secret   # name of a key in var.auth_method_secrets
    unique_identifier: email
    jwt_ttl: 60
    force_sub_claims: true
    audit_logs_claims: [email, groups]
    allowed_client_type: [ui, cli]
    delete_protection: true

  /governance/auth/aws-payments-prod:
    type: aws_iam
    bound_aws_account_id: ["123456789012"]
    bound_role_name: [payments-app]
    delete_protection: true

  /governance/auth/k8s-payments-prod:
    type: k8s
    bound_namespaces: [payments]
    bound_sa_names: [payments-api]
    delete_protection: true
